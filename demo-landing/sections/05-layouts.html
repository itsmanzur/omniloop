<!-- OmniLoop landing | 05 Filter layouts -->
<section class="ol-landing ol-landing--cream" data-ol-landing="layouts" id="ol-layouts">
	<div class="ol-landing__inner">
		<p class="ol-kicker">Filter styles</p>
		<h2 class="ol-h ol-h--sm">Same catalog. Pick a mood.</h2>
		<p class="ol-lead">These are the six OmniLoop layouts. Click a style, then Bags or Clay. Counts on each chip are live. Chip Only hides the facets until you open Filters.</p>
		<div class="ol-switch">
			<button type="button" class="is-on" data-ol-switch="sidebar">Sidebar</button>
			<button type="button" data-ol-switch="accordion">Accordion</button>
			<button type="button" data-ol-switch="toolbar">Toolbar</button>
			<button type="button" data-ol-switch="mega">Mega Bar</button>
			<button type="button" data-ol-switch="pills">Pills</button>
			<button type="button" data-ol-switch="chip">Chip Only</button>
		</div>
		<p class="ol-hint" data-ol-layout-copy>Facets stay on the left. Best when a shop has color, size, price, and a few taxonomies.</p>
		<div class="ol-shop" data-style="sidebar">
			<button type="button" class="ol-shop__chip" data-ol-shop-open>Filters</button>
			<div class="ol-shop__filters">
				<span class="ol-shop__lab">Category</span>
				<button type="button" class="ol-pill" data-ol-play-cat="bags">Bags <b data-ol-n></b></button>
				<button type="button" class="ol-pill" data-ol-play-cat="apparel">Apparel <b data-ol-n></b></button>
				<button type="button" class="ol-pill" data-ol-play-cat="home">Home <b data-ol-n></b></button>
				<span class="ol-shop__lab">Color</span>
				<button type="button" class="ol-swatch-btn" data-ol-play-color="navy"><i class="ol-swatch ol-ph--navy"></i> Navy <b data-ol-n></b></button>
				<button type="button" class="ol-swatch-btn" data-ol-play-color="clay"><i class="ol-swatch ol-ph--clay"></i> Clay <b data-ol-n></b></button>
				<button type="button" class="ol-shop__clear" data-ol-play-clear>Clear</button>
			</div>
			<div class="ol-shop__grid" data-ol-play-grid></div>
		</div>
	</div>
</section>
