<!-- OmniLoop landing | 06 Card styles -->
<section class="ol-landing" data-ol-landing="cards" id="ol-cards">
	<div class="ol-landing__inner">
		<p class="ol-kicker">Card styles</p>
		<h2 class="ol-h ol-h--sm">Same three products. Six skins.</h2>
		<p class="ol-lead">Harbor Tote, Ink Field Jacket, Ink Table Lamp. Pick a skin. In the module, Divi’s Design tab still owns type, borders, and sale badges.</p>
		<div class="ol-switch">
			<button type="button" class="is-on" data-ol-switch="classic">Classic</button>
			<button type="button" data-ol-switch="overlay">Overlay</button>
			<button type="button" data-ol-switch="list">List</button>
			<button type="button" data-ol-switch="compact">Compact</button>
			<button type="button" data-ol-switch="masonry">Masonry</button>
			<button type="button" data-ol-switch="carousel">Carousel</button>
		</div>
		<p class="ol-hint" data-ol-card-copy>Image, title, meta, price. The default Woo-style card.</p>
		<div class="ol-cards-show" data-style="classic" data-ol-card-grid></div>
	</div>
</section>
